[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "omnipose"
description = "Omnipose: cell segmentation algorithm and GUI"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Kevin Cutler", email = "kevinjohncutler@outlook.com" }]
# ocdkit and ncolor require >=3.11; keep this in sync with them
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# version is single-sourced from omnipose/__init__.py (__version__)
dynamic = ["version"]

dependencies = [
    "ocdkit>=0.0.8",    # shared utilities (array, gpu, io, measure, morphology, spatial); >=0.0.8 for the build_volume_bundle viewer-plugin contract
    "numba>=0.61.0",    # let numba control numpy version
    "numpy",            # numba controls numpy version (v2 supported across deps as of July 2025)
    "scipy",
    "edt",
    "scikit-image>=0.26",
    "ncolor>=1.4.3",
    "torch>=1.10",
    "torchvision",      # redundant from torchvf
    "mgen",
    "matplotlib",
    "ipywidgets",       # could factor out to a notebook dep list
    "torchvf",          # do we need this anymore?
    "tqdm",
    "natsort",
    "bioio",
    "bioio-czi",        # CZI file support plugin
    "numexpr",
    "torch_optimizer",  # for RADAM, now supported directly in pytorch
    "tifffile",
    "fastremap",
    "cmap",
    "dbscan",           # ~2x faster than sklearn dbscan
    "imagecodecs",
    "opensimplex",      # ND simplex noise for illumination augmentation
    "dask",
    # opt_einsum removed — benchmarked at parity with matmul in ocdkit.plot.colorize
]

# Optional groups installable via ``pip install omnipose[gui]`` etc.
[project.optional-dependencies]
gui = [
    "imageio",
    "pywebview",
    "fastapi",
    "uvicorn",
]
# distributed group is currently empty; "all" = gui (+ distributed when it grows)
all = ["omnipose[gui]"]
dev = [
    "pytest",
    "pytest-cov",
    "coverage",
    "genbadge[coverage]",
    # notebook-driven plot tests (tests/test_plot_notebook.py)
    "nbformat",
    "nbclient",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/kevinjohncutler/omnipose"

[project.scripts]
omnipose = "omnipose.__main__:main"
omnipose-loss-server = "omnipose.cli.loss_server:main"
omnipose-sweep-report = "omnipose.cli.sweep_report:main"

[project.entry-points."ocdkit.plugins"]
omnipose = "omnipose.gui:plugin"

[tool.setuptools.dynamic]
version = { attr = "omnipose.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the dock/window icon (and the larger logo) so the GUI launcher
# can find them when installed from a wheel.
"omnipose.gui" = ["*.png"]

[tool.pytest.ini_options]
testpaths     = ["tests"]
norecursedirs = ["trash"]
markers = [
  "slow: end-to-end tests that run real inference (deselect with '-m \"not slow\"')",
]
filterwarnings = [
  "ignore::DeprecationWarning:networkit.profiling.profiling",
  "ignore:.*torch\\.jit\\.script_method.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["omnipose"]
omit = [
  "*/_version.py",
  "*/omnipose/experimental/*",
  "*/omnipose/cli/loss_server.py",
]

[tool.coverage.paths]
source = [
  "src/omnipose",
  "/Volumes/DataDrive/omnipose/src/omnipose",
  "/home/kcutler/DataDrive/omnipose/src/omnipose",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if verbose:",
  "models_logger\\.",
  "omnipose_logger\\.",
  "warnings\\.warn",
]
